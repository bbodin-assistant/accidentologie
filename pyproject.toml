[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "accidentologie"
version = "0.1.0"
description = "API Python pour explorer et visualiser les données BAAC françaises"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Projet Accidentologie"}]
dependencies = [
    "pandas>=2.0,<3.0",
    "folium>=0.16,<1.0",
    "matplotlib>=3.8,<4.0",
    "scikit-learn>=1.4,<2.0",
    "scipy>=1.11,<2.0",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4.0,<5.0"]

[tool.setuptools.packages.find]
include = ["accidentologie*"]
