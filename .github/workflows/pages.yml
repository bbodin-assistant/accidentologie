name: Carte CARA GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "accidentologie/**"
      - "data/**/*.csv"
      - "data/reference/cara_communes.geojson"
      - "tests/**"
      - "pyproject.toml"
      - ".github/build_pages.py"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt sans les objets LFS
        uses: actions/checkout@v6
        with:
          lfs: false

      # La clé dépend des pointeurs LFS. Elle change uniquement lorsqu'un CSV BAAC
      # est remplacé, et non à chaque modification du code ou du README.
      - name: Restaurer le cache des CSV BAAC
        id: baac-cache
        uses: actions/cache@v5
        with:
          path: data/[0-9][0-9][0-9][0-9]
          key: baac-lfs-${{ runner.os }}-${{ hashFiles('data/**/*.csv') }}

      - name: Récupérer les objets LFS si le cache est absent
        if: steps.baac-cache.outputs.cache-hit != 'true'
        run: >-
          git lfs pull
          --include="data/**/caracteristiques-*.csv,data/**/usagers-*.csv,data/**/vehicules-*.csv"
          --exclude=""

      - name: Vérifier les données matérialisées
        shell: bash
        run: |
          set -euo pipefail
          found_year=false
          for year_dir in data/[12][0-9][0-9][0-9]; do
            test -d "$year_dir" || continue
            found_year=true
            year="${year_dir##*/}"
            for table in caracteristiques usagers vehicules; do
              file="$year_dir/$table-$year.csv"
              test -s "$file"
              if head -n 1 "$file" | grep -q 'git-lfs'; then
                echo "Erreur : $file est encore un pointeur Git LFS." >&2
                exit 1
              fi
            done
          done
          test "$found_year" = true
          du -sh data

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer accidentologie
        run: python -m pip install .

      - name: Tester la bibliothèque
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -s tests -v

      - name: Générer la carte WebGL de la CARA
        env:
          MPLBACKEND: Agg
        run: python .github/build_pages.py --output-dir site

      - name: Résumer le site
        run: |
          du -sh site
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("site/manifest.json").read_text())
          print(f"Accidents : {manifest['totalAccidents']:,}")
          print(f"Points géolocalisés : {manifest['totalMapped']:,}")
          print(f"Années : {len(manifest['years'])}")
          PY

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v6

      - name: Publier l'artifact Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Déployer GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
